# Public, third-party-executed run of the release gate.
#
# Q7 of the external review asked whether anyone other than the maintainers
# has run the gate. A CI run is not an independent human audit (that remains
# open and invited), but it moves the gate from "the maintainers ran it on
# their machine" to "GitHub's public runners execute it on every tag and every
# push to main, with logs anyone can inspect". The command below is exactly
# the one documented in REPRODUCE.md for a fresh clone.
name: release-gate
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the gate's dependency subset (pins from requirements.txt)
        run: |
          python -m pip install --quiet \
            numpy==2.4.2 pandas==3.0.0 scipy==1.17.0 h5py==3.15.1 \
            pyarrow==23.0.0 pyyaml==6.0.3 scikit-learn==1.8.0 \
            matplotlib==3.10.8 mlcroissant==1.1.0
      - name: Release gate (fresh checkout = what reviewers get)
        run: python scripts/release_gate.py
